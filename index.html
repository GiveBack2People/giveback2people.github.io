<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Color scheme declaration -->
  <meta name="color-scheme" content="light dark">
  
  <!-- FOUC prevention inline script -->
  <script>
    try {
      const savedTheme = localStorage.getItem("color-scheme");
      if (savedTheme) {
        document.querySelector('meta[name="color-scheme"]').content = savedTheme;
      }
    } catch (e) {}
  </script>

  <title>GiveBack2People — Open Source & Creative Resources</title>
  <meta name="description" content="Open-source tools, curated creative resources, and practical knowledge built to pay it forward.">
  
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- Header -->
    <header class="header">
      <a href="#" class="brand">
        <img src="assets/logo.svg" alt="GiveBack2People Logo" class="brand-icon" width="32" height="32">
        <span>GiveBack2People</span>
      </a>

      <div class="header-links">
        <a href="https://github.com/GiveBack2People" class="nav-link" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <button id="theme-btn" class="theme-btn" type="button" aria-label="Toggle light or dark theme">
          <svg class="icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg class="icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <span id="theme-label">Theme</span>
        </button>
      </div>
    </header>

    <!-- Intro -->
    <main>
      <section class="intro">
        <h1 class="intro-title">GiveBack2People</h1>
        <p class="intro-desc">
          Open-source tools, curated creative resources, and practical knowledge built to pay it forward to creators and developers worldwide.
        </p>
      </section>

      <!-- Projects Section -->
      <section>
        <div class="section-meta">
          <span class="section-title" id="repo-count-label">Repositories</span>
          <span class="sort-indicator">sorted by stars ↓</span>
        </div>

        <div id="repo-list" class="repo-list" aria-live="polite">
          <!-- Loading skeleton -->
          <div class="skeleton-card">
            <div class="skeleton-line" style="width: 40%;"></div>
            <div class="skeleton-line" style="width: 85%;"></div>
            <div class="skeleton-line" style="width: 60%;"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div>
        &copy; <span id="current-year"></span> GiveBack2People • Released under <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener noreferrer">MIT</a>
      </div>
      <div>
        <a href="https://github.com/GiveBack2People" target="_blank" rel="noopener noreferrer">github.com/GiveBack2People</a>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      // Dynamic year
      const yearEl = document.getElementById('current-year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // Theme toggle
      const metaColorScheme = document.querySelector('meta[name="color-scheme"]');
      const themeBtn = document.getElementById('theme-btn');

      function getCurrentScheme() {
        const stored = localStorage.getItem('color-scheme');
        if (stored === 'light' || stored === 'dark') return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function applyTheme(theme) {
        if (theme === 'light' || theme === 'dark') {
          metaColorScheme.content = theme;
          localStorage.setItem('color-scheme', theme);
        } else {
          metaColorScheme.content = 'light dark';
          localStorage.removeItem('color-scheme');
        }
      }

      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const next = getCurrentScheme() === 'dark' ? 'light' : 'dark';
          applyTheme(next);
        });
      }

      window.addEventListener('storage', (e) => {
        if (e.key === 'color-scheme') {
          metaColorScheme.content = e.newValue || 'light dark';
        }
      });

      // Auto-sync repositories from GitHub API
      const ORG_NAME = 'GiveBack2People';
      const CACHE_KEY = `gh_repos_${ORG_NAME}`;
      const CACHE_TTL = 10 * 60 * 1000; // 10 minutes cache
      const container = document.getElementById('repo-list');
      const countLabel = document.getElementById('repo-count-label');

      function renderRepos(repos) {
        if (!repos || repos.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              No public repositories found. Check back soon or visit <a href="https://github.com/${ORG_NAME}" target="_blank" rel="noopener noreferrer">GitHub</a>.
            </div>`;
          return;
        }

        countLabel.textContent = `Repositories (${repos.length})`;

        container.innerHTML = repos.map(repo => {
          const hasHomepage = repo.homepage && repo.homepage.trim() !== '';
          const primaryLink = hasHomepage ? repo.homepage : repo.html_url;
          const stars = repo.stargazers_count || 0;
          const description = repo.description || 'No description provided.';
          const topics = Array.isArray(repo.topics) ? repo.topics.slice(0, 5) : [];

          return `
            <article class="repo-card">
              <div class="repo-top">
                <div class="repo-title-group">
                  <a href="${primaryLink}" class="repo-name" target="_blank" rel="noopener noreferrer">${repo.name}</a>
                  ${hasHomepage ? `
                    <a href="${repo.homepage}" class="live-pill" target="_blank" rel="noopener noreferrer" title="View live documentation/site">
                      ● Live Site ↗
                    </a>` : ''}
                </div>
                <div class="stars-count" title="${stars} GitHub Stars">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                  </svg>
                  <span>${stars}</span>
                </div>
              </div>

              <p class="repo-desc">${escapeHtml(description)}</p>

              <div class="repo-bottom">
                <div class="repo-tags">
                  ${repo.language ? `<span class="tag" style="font-weight:600;">${escapeHtml(repo.language)}</span>` : ''}
                  ${topics.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
                </div>

                <div class="repo-links">
                  ${hasHomepage ? `<a href="${repo.homepage}" class="action-link" target="_blank" rel="noopener noreferrer">Live Site ↗</a>` : ''}
                  <a href="${repo.html_url}" class="action-link" target="_blank" rel="noopener noreferrer">Source ↗</a>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function fetchRepositories() {
        // Try sessionStorage cache first
        try {
          const cached = sessionStorage.getItem(CACHE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Date.now() - parsed.timestamp < CACHE_TTL) {
              renderRepos(parsed.data);
              return;
            }
          }
        } catch (e) {}

        // Fetch fresh data from GitHub REST API
        fetch(`https://api.github.com/orgs/${ORG_NAME}/repos?per_page=100`)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP error ${res.status}`);
            return res.json();
          })
          .then(data => {
            // Filter out internal repos (.github and the github.io root site)
            const filtered = data.filter(r => {
              const name = r.name.toLowerCase();
              return name !== '.github' && name !== `${ORG_NAME.toLowerCase()}.github.io`;
            });

            // Sort by stars descending (user preference)
            filtered.sort((a, b) => {
              const starsDiff = (b.stargazers_count || 0) - (a.stargazers_count || 0);
              if (starsDiff !== 0) return starsDiff;
              return new Date(b.pushed_at) - new Date(a.pushed_at);
            });

            // Cache in sessionStorage
            try {
              sessionStorage.setItem(CACHE_KEY, JSON.stringify({
                timestamp: Date.now(),
                data: filtered
              }));
            } catch (e) {}

            renderRepos(filtered);
          })
          .catch(err => {
            console.error('Failed to fetch repositories:', err);
            // Fallback rendering
            container.innerHTML = `
              <div class="empty-state">
                <p>Could not dynamically load projects. View them directly on GitHub:</p>
                <p style="margin-top:0.5rem;"><a href="https://github.com/${ORG_NAME}" target="_blank" rel="noopener noreferrer" class="action-link">github.com/${ORG_NAME} ↗</a></p>
              </div>`;
          });
      }

      fetchRepositories();
    })();
  </script>
</body>
</html>
